# Hosted deployment (agent-relay, see .relay.yml). The project name is pinned so
# the database volume stays depsight_postgres_data wherever the checkout lives and
# the dev stack (docker-compose.dev.yml, project depsight-dev) can never share it.
name: depsight

# Rotating container logs for every service: without it the json-file driver keeps one
# unbounded file per container. Three files of 10 MB each is about 30 MB per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      # Explicit V8 heap ceiling: Node otherwise derives it from the memory cap.
      - NODE_OPTIONS=--max-old-space-size=1024
      # One variable feeds the app, the db service and the migrate service. The :-depsight
      # fallback is the password of the live database; see docs/configuration.md
      # (Rotating the database password).
      - DATABASE_URL=postgresql://depsight:${POSTGRES_PASSWORD:-depsight}@db:5432/depsight
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Fails on any non-2xx answer, so /api/health's 503 (database unreachable) marks the
    # container unhealthy. The runner image has neither curl nor wget, hence inline Node.
    # The fetch gives up after 9s, inside the 10s probe timeout, so a slow answer is a
    # failed probe and not a hung one. start_period covers a cold Next start: failures
    # inside it do not count, and start_interval probes every 2s during it, so the first
    # passing probe, and the end of the period, comes about 2s after the server is up
    # (start_interval needs Docker Engine 25 or later).
    # Plain compose does not restart an unhealthy container: the status shows in
    # `docker ps` and `docker compose ps`, it is not a self-healing mechanism.
    # Traefik's docker provider routes only to a healthy container: while it is starting or
    # unhealthy (5 failed probes in a row), both routers below answer 404.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(9000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
      start_interval: 2s
    # Memory cap for the running server and its scan cycles (the image build runs before
    # the container exists and is not under this limit). The heap is the binding limit:
    # NODE_OPTIONS sets it to 1024 MiB, so the cap leaves 512 MiB for buffers and native
    # memory. Sizing: docs/configuration.md, Health check, resource limits and log rotation.
    mem_limit: 1536m
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      # depsight.opentriologue.ai
      - "traefik.http.routers.depsight.rule=Host(`depsight.opentriologue.ai`)"
      - "traefik.http.routers.depsight.entrypoints=websecure"
      - "traefik.http.routers.depsight.tls=true"
      - "traefik.http.routers.depsight.tls.certresolver=letsencrypt"
      - "traefik.http.services.depsight.loadbalancer.server.port=3000"
      # app is on two networks: without this label Traefik may pick the db network
      # (an address it cannot reach) at random when its provider default differs.
      - "traefik.docker.network=traefik-public"
      # ci-insights.opentriologue.ai — same container, second router
      - "traefik.http.routers.ci-insights.rule=Host(`ci-insights.opentriologue.ai`)"
      - "traefik.http.routers.ci-insights.entrypoints=websecure"
      - "traefik.http.routers.ci-insights.tls=true"
      - "traefik.http.routers.ci-insights.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ci-insights.service=depsight"
    networks:
      - traefik-public
      - db-internal

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: depsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-depsight}
      POSTGRES_DB: depsight
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depsight"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    # Only the private db network: not on traefik-public, no published port.
    networks:
      - db-internal

  # One-shot schema apply, run by the .relay.yml post_update hook with
  # `docker compose -f docker-compose.traefik.yml run --rm -T --build migrate`. The profile
  # keeps `up`, `build` and the health check from starting it. It is the `migrate` stage of
  # this repo's Dockerfile: the Prisma CLI is the version package-lock.json pins, openssl and
  # the schema are baked in at build time, so the run fetches nothing and the service sits
  # only on db-internal, which has no route out. The image is built by the post_update hook
  # itself (`run --build`): the relay runs pre_update on the tree from before the pull, a
  # plain `docker compose build` skips a profile-scoped service, and `run` alone reuses an
  # existing image, so any earlier build would bake in the previous commit's schema.
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    working_dir: /app
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql://depsight:${POSTGRES_PASSWORD:-depsight}@db:5432/depsight
    command:
      - sh
      - -c
      - >-
        prisma db execute --file prisma/pre-push/advisory-unique-key.sql --schema=prisma/schema.prisma
        && prisma db push --skip-generate --schema=prisma/schema.prisma
    mem_limit: 512m
    logging: *default-logging
    networks:
      - db-internal

volumes:
  postgres_data:

networks:
  traefik-public:
    external: true
  # internal: no route out of the network. Compose scopes the name to the project
  # (depsight_db-internal), so a second stack of this file gets its own network.
  db-internal:
    internal: true
