# Production stack for self-hosting WITHOUT a reverse proxy (`make prod`): the app is
# published on port 3000 and the database on 127.0.0.1:5432. Before exposing the host,
# follow docs/configuration.md (Self-hosting): set POSTGRES_PASSWORD, put a reverse proxy in
# front and bind port 3000 to 127.0.0.1, set WEBHOOK_TRUSTED_PROXY_HOPS, and apply the
# schema yourself (this file has no migrate service). docker-compose.traefik.yml is the
# hosted instance's file, with its hostnames; see "Which compose file" in the same chapter.
# Do not run the dev stack (docker-compose.dev.yml) from the same checkout: the dev file has
# its own project name and database volume, and `make dev*` pins it with -p.
name: depsight

# Rotating container logs for every service: without it the json-file driver keeps one
# unbounded file per container. Three files of 10 MB each is about 30 MB per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Explicit V8 heap ceiling: Node otherwise derives it from the memory cap.
      - NODE_OPTIONS=--max-old-space-size=1024
      - DATABASE_URL=postgresql://depsight:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (an existing database keeps its current password, depsight if you never changed it)}@db:5432/depsight
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Fails on any non-2xx answer, so /api/health's 503 (database unreachable) marks the
    # container unhealthy. The runner image has neither curl nor wget, hence inline Node.
    # The fetch gives up after 9s, inside the 10s probe timeout, so a slow answer is a
    # failed probe and not a hung one. start_period covers a cold Next start: failures
    # inside it do not count, and start_interval probes every 2s during it, so the first
    # passing probe, and the end of the period, comes about 2s after the server is up
    # (start_interval needs Docker Engine 25 or later).
    # Plain compose does not restart an unhealthy container: the status shows in
    # `docker ps` and `docker compose ps`, it is not a self-healing mechanism.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(9000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
      start_interval: 2s
    # Memory cap for the running server and its scan cycles (the image build runs before
    # the container exists and is not under this limit). The heap is the binding limit:
    # NODE_OPTIONS sets it to 1024 MiB, so the cap leaves 512 MiB for buffers and native
    # memory. Sizing: docs/configuration.md, Health check, resource limits and log rotation.
    mem_limit: 1536m
    logging: *default-logging

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: depsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (an existing database keeps its current password, depsight if you never changed it)}
      POSTGRES_DB: depsight
    ports:
      # Loopback only: the schema-apply step in docs/configuration.md runs from the
      # host against localhost:5432. Never publish this port on all interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depsight"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging

volumes:
  postgres_data:
