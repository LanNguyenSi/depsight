name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npm ci --no-audit --no-fund
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npm ci --no-audit --no-fund
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npx prisma generate
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npm ci --no-audit --no-fund
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npx prisma generate
      - run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npm ci --no-audit --no-fund
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npx prisma generate
      - run: npm run build
      - name: Build leaves the tree clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  advisory-dedupe:
    name: Advisory dedupe (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: depsight
          POSTGRES_PASSWORD: depsight
          POSTGRES_DB: depsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U depsight"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DEPSIGHT_TEST_DATABASE_URL: postgresql://depsight:depsight@localhost:5432/depsight
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npm ci --no-audit --no-fund
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npx prisma generate
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npx vitest run tests/unit/advisory-dedupe-db.test.ts

  mcp-test:
    name: MCP Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npm ci --no-audit --no-fund
        working-directory: mcp
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/stop-commands-run.sh" npx tsc --noEmit
        working-directory: mcp
      - run: npm test
        working-directory: mcp
