name: Publish MCP to npm

# Tag-driven publish for the standalone mcp/ package (@opentriologue/depsight-mcp).
# This is intentionally separate from release.yml (which cuts a GitHub Release for
# the Next.js app on `v*` tags) so app and MCP releases never collide.
#
# To cut an MCP release:
#   1. Bump mcp/package.json version.
#   2. Commit, then push a matching tag: `git tag depsight-mcp-v0.2.0 && git push origin depsight-mcp-v0.2.0`.
# The tag suffix must equal mcp/package.json version or the job fails the version check.
#
# Prerequisite (operator, one-time): the `@opentriologue` npm org must exist and the
# package needs a Trusted Publisher entry on npmjs.com (repo LanNguyenSi/depsight,
# workflow publish-npm.yml) — publishing is tokenless via OIDC, no NPM_TOKEN secret.

on:
  push:
    tags:
      - "depsight-mcp-v*"

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    name: Publish @opentriologue/depsight-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Verify package.json version matches tag
        run: |
          expected="${GITHUB_REF_NAME#depsight-mcp-v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "$expected" ]; then
            echo "Tag version ($expected) does not match mcp/package.json ($pkg_version)" >&2
            exit 1
          fi
          echo "Publishing @opentriologue/depsight-mcp@$pkg_version"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; node 22 bundles
      # npm 10, so upgrade right before the publish step (wave standard:
      # install/build run under the node-bundled npm). Auth comes from the
      # GitHub OIDC token (id-token: write above) matched against the
      # package's Trusted Publisher entry on npmjs.com (repo
      # LanNguyenSi/depsight, workflow publish-npm.yml) — no NPM_TOKEN.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11 --no-audit --no-fund

      - name: Publish
        run: npm publish --access public --provenance
